; Application configuration file

; Paths
; Must have trailing slash
[Paths]
; Absolute path to engine directory
; default: _STRING_
; values: _STRING_
CoreDir = "c:/www/work.rudisoft.dev/RudWEb/rudweb/"
; Absolute path to application directory
; default: _STRING_
; values: _STRING_
AppDir = "c:/www/work.rudisoft.dev/RudWEb/test/"
; URL used to access application
; default: _STRING_
; values: _STRING_
AppURL = "http://work.rudisoft.dev/RudWEb/test/"

; Database configuration
[Database]
; Database type.
; default: mysql
; values: mysql, mysqli, postgres, sqlite
; support: mysql
Type = "mysql"
; Database host.
; default: localhost
; values:  _STRING_
Host = "localhost"
; Database port.
; default : 3306 (mysql/mysqli), 5432 (postgres), _BLANK_ (sqlite)
; values : _INTEGER_
Port = "3306"
; Database user name.
; default: _STRING_
; values: _STRING_
User = "rudweb"
; Database password.
; default: _STRING_
; values: _STRING_
Pass = "REDACTED"
; Database name.
; default: _STRING_
; values: _STRING_
Name = "rudweb_test"

; Application information
[AppInfo]
; Application name.
; default: _STRING_
; values: _STRING_
Name   = "Test Application"
; Application author.
; default: _STRING_
; values: _STRING_
Author = "Radu Maier"
; Application prefix.
; Used for security and database tables prefixing, among others.
; default: _STRING_
; values: _STRING_
Prefix = "tst"

; Some configuration options
[Config]
; Report application errors?
; default: 0
; values: 0 (disabled), 1 (enabled)
Errors = 1
; Use fake file extension for URL's?
; default: 0
; values: 0 (disabled), 1 (enabled)
Fakext = 1
; Remove index.php from URL's
; Set this to 1 if mod_rewrite is enabled.
; default: 0
; values: 0 (disabled), 1 (enabled)
FullSEO = 1

; Default application configuration
[Defaults]
; Default language to load
; default: _STRING_
; values: _STRING_
Language = "en"
; Default timezone
; default: Europe/Bucharest
; values: see http://www.php.net/timezones
TimeZone = "Europe/Bucharest"
; Default skin.
; Enter directory name here
; default: _STRING_
; values: _STRING_
Skin = "rudweb"