; Main configuration
; Set these to 1/0 for TRUE/FALSE
[Config]
; Report application errors
Errors = 0
; Use database
Database = 0
; Use sessions and users
Sessions = 0
; Use user authentication
Users = 0
; Use fake file extension for URL's
Fakext = 0

; Paths
; must end in a slash (/)
[Paths]
; Engine path
Engine = "path/to/engine/"
; Application path
App = "path/to/app"
; Application URL
AppURL = "http://www.example.com/"

; Database configuration
[Database]
Type = "mysql"
Host = "localhost"
Port = "3306"
User = "db_user"
Pass = "db_pass"
Name = "db_name"

; Application information
[AppInfo]
Name   = "Application Name"
Author = "Author Name"
Prefix = "prefix"

; Default application configuration
[Defaults]
; Combined with the SeoURLs extension
; this provides full SEO functionality
; by removing 'index.php' from URLs.
; If mod_rewrite is available, set this to 1
FullSEO = 0
; Default language
Language = "en"
; Default skin (dir name)
Skin = "mySkin"
; Default timezone (http://www.php.net/timezones)
TimeZone = "Europe/Bucharest"
; Default outupt type
; default "rudweb" - not necessary (leave blank or write anything)
; values "rudweb/Smarty/image/BLANK(rudweb)"
; you can override this in individual pages
OutType = ""
; Main layout template directory.
; default ""
; values "BLANK/DIR_NAME"
; you can override this in invidual pages
SkinDir = ""
; Main layout template file
; default BLANK = "layout"
; values "TPL_NAME"
; you can override this in invidual pages
SkinTpl = ""

; Extensions to load
; Only put here extensions you want loaded.
; No value required (ignored anyway)
[Extensions]
SeoURLs = 
Sessions = 
Users = 
Captcha = 
Thumb = 
delFD =
Intl =