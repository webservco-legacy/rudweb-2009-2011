; Localization configuration
[Language]
; Default content
; (what to show if no page is requested)
; default "page/index"
; Content type
; values "page/content/BLANK(page)"
; default "page"
ContentType = ""
; Content id [page name/content id (+alias)]
; default "index"
ContentId = ""
; Main layout page title
; default ""
; values "BLANK/TITLE"
; you can override this in invidual pages
PageTitle = ""
; Meta Subject
; default BLANK = App Name
; values "TEXT"
; you can override this in invidual pages
MetaSubject = ""
; Meta Description
; default BLANK = App Name
; values "TEXT"
; you can override this in invidual pages
MetaDescription = ""
; Meta Keywords
; default BLANK = App Name
; values "TEXT"
; you can override this in invidual pages
MetaKeywords = ""
; Meta Copyright
; default BLANK = App Author
; values "TEXT"
; you can override this in invidual pages
MetaCopyright = ""
; Meta Designer
; default BLANK = App Author
; values "TEXT"
; you can override this in invidual pages
MetaDesigner = ""
; Meta Publisher
; default BLANK = App Author
; values "TEXT"
; you can override this in invidual pages
MetaPublisher = ""
; Meta Author
; default BLANK = App Author
; values "TEXT"
; you can override this in invidual pages
MetaAuthor = ""